replicaCount: 1

rackGateway:
  enabled: false
  image:
    repository: ""
    digest: ""
  listenIP: ""
  nodeSelector: {}
  packageProxy:
    enabled: false
    listenPort: 12403
    backendHost: ""
    backendPort: 443
rackGateways: []

podNetwork:
  hostNetwork: false

image:
  repository: ""
  digest: ""
  pullPolicy: IfNotPresent

existingSecret: flyt-adapter

clientPackageServer:
  enabled: false
  image:
    repository: ""
    digest: ""
  servicePort: 8080
  route:
    enabled: false
    hostname: ""
    pathPrefix: /flyt-client
    gatewayName: openstack-public-gateway
    gatewayNamespace: openstack-gateway-system
    sectionName: https

notifications:
  enabled: false
  secretName: flyt-adapter-notifications
  secretKey: transport-url

reconciler:
  enabled: false

openstack:
  enabled: false
  tokenGeneration: ""
  novaEndpoint: ""
  glanceEndpoint: ""
  placementEndpoint: ""
  neutronEndpoint: ""
  caFile: ""
  caConfigMapName: ""
  tokenSecretName: flyt-adapter-openstack
  tokenSecretKey: token
  placementSync:
    enabled: false
    aggregateUuid: ""
    computeProviderUuids: []

clusterManager:
  enabled: false
  # Publish only the two FLYT ports on the selected node while the Pod keeps
  # an isolated network namespace.
  hostPorts: false
  hostIP: ""
  image:
    repository: ""
    digest: ""
  configSecret: flyt-cluster-manager
  nodePort: 12401
  clientPort: 12402
  service:
    type: LoadBalancer
    loadBalancerIP: ""
    externalIPs: []
    annotations: {}
  clientCidrs: []
  nodeCidrs: []
  mongodb:
    image:
      repository: ""
      digest: ""
    existingSecret: flyt-mongodb
    storageSize: 1Gi
    storageClassName: ""
    # Exact node addresses used when the Cluster Manager runs with hostNetwork.
    clientCidrs: []
    # Required on Cilium when the Cluster Manager uses hostNetwork. MongoDB is
    # still ClusterIP-only and authenticated; this permits the Cilium host
    # identity solely on TCP/27017.
    allowCiliumHost: false

gpuCells:
  enabled: false
  namespace: flyt-system
  serviceAccountName: flyt-adapter
  endpoint: https://kubernetes.default.svc
  caFile: /var/run/secrets/flyt-kubernetes/ca.crt
  tokenFile: /var/run/secrets/flyt-kubernetes/token
  # Kubernetes API endpoint CIDRs reachable from the Adapter Pod. Required
  # when GPU Cell orchestration is enabled so NetworkPolicy stays fail-closed.
  apiServerCidrs: []
  # Include both the Kubernetes Service port and the post-DNAT endpoint port.
  apiServerPorts: [443, 6443]
  image:
    repository: ""
    digest: ""
  clusterManagerAddress: ""
  runtimeClassName: nvidia
  hostNetwork: false
  sessionProfiles:
    flyt-nvidia-rtx3090ti-mps-shared-v1: nvidia-rtx3090ti-whole-mps
  profiles:
    nvidia-rtx3090ti-whole-mps:
      device_class: gpu.nvidia.com
      expected_product_name: NVIDIA GeForce RTX 3090 Ti
      selectors:
        - "device.attributes['gpu.nvidia.com'].productName.lowerAscii().matches('^.*rtx 3090 ti.*$')"

service:
  port: 8080

config:
  clientManagerEndpoint: ""
  reconcileIntervalSeconds: 60
  orphanGraceSeconds: 900
  approvals: []
  inventory:
    flyt-nvidia-rtx3090ti-mps-shared-v1: 0
  quotas: []
  serviceNetwork:
    networks:
      default: fake-flyt-network
    subnets: {}
    securityGroupIds: []
  flytManager:
    profiles:
      flyt-nvidia-rtx3090ti-mps-shared-v1:
        compute_units: 16
        memory_mb: 8192
  clientPackage:
    url: ""
    digest: ""
    resolveAddress: ""

persistence:
  enabled: false
  size: 1Gi
  storageClassName: ""

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

nodeSelector: {}
tolerations: []
affinity: {}
