{{- if .Values.openstack.placementSync.enabled }}
{{- if not .Values.openstack.enabled }}{{ fail "placement sync requires openstack.enabled" }}{{ end }}
{{- $repository := required "image.repository is required" .Values.image.repository }}
{{- $digest := required "image.digest is required" .Values.image.digest }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "flyt-adapter.name" . }}-placement-sync
  labels:
    {{- include "flyt-adapter.labels" . | nindent 4 }}
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
      - name: sync
        image: {{ printf "%s@%s" $repository $digest | quote }}
        args: ["--config", "/etc/flyt-adapter/config.json", "--mode", "placement-sync"]
        env:
        - name: FLYT_API_TOKEN
          valueFrom: {secretKeyRef: {name: {{ .Values.existingSecret }}, key: api-token}}
        - name: OS_TOKEN
          valueFrom: {secretKeyRef: {name: {{ .Values.openstack.tokenSecretName }}, key: {{ .Values.openstack.tokenSecretKey }}}}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities: {drop: ["ALL"]}
          readOnlyRootFilesystem: true
        volumeMounts:
        - {name: config, mountPath: /etc/flyt-adapter, readOnly: true}
        - {name: tmp, mountPath: /tmp}
      volumes:
      - name: config
        configMap: {name: {{ include "flyt-adapter.name" . }} }
      - name: tmp
        emptyDir: {}
{{- end }}
