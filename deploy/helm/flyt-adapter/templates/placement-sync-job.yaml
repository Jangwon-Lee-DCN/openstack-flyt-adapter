{{- if .Values.openstack.placementSync.enabled }}
{{- if not .Values.openstack.enabled }}{{ fail "placement sync requires openstack.enabled" }}{{ end }}
{{- $repository := required "image.repository is required" .Values.image.repository }}
{{- $digest := required "image.digest is required" .Values.image.digest }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "flyt-adapter.name" . }}-placement-sync
  labels:
    {{- include "flyt-adapter.labels" . | nindent 4 }}
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: Never
      {{- if .Values.podNetwork.hostNetwork }}
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      {{- end }}
      {{- if .Values.gpuCells.enabled }}
      serviceAccountName: {{ .Values.gpuCells.serviceAccountName }}
      {{- end }}
      automountServiceAccountToken: false
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      tolerations:
        {{- toYaml .Values.tolerations | nindent 8 }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
      - name: sync
        image: {{ printf "%s@%s" $repository $digest | quote }}
        args: ["--config", "/etc/flyt-adapter/config.json", "--mode", "placement-sync"]
        env:
        - name: FLYT_API_TOKEN
          valueFrom: {secretKeyRef: {name: {{ .Values.existingSecret }}, key: api-token}}
        - name: OS_TOKEN
          valueFrom: {secretKeyRef: {name: {{ .Values.openstack.tokenSecretName }}, key: {{ .Values.openstack.tokenSecretKey }}}}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities: {drop: ["ALL"]}
          readOnlyRootFilesystem: true
        volumeMounts:
        - {name: config, mountPath: /etc/flyt-adapter, readOnly: true}
        - {name: tmp, mountPath: /tmp}
        {{- if .Values.openstack.caConfigMapName }}
        - {name: openstack-ca, mountPath: /etc/flyt-openstack-ca, readOnly: true}
        {{- end }}
        {{- if .Values.gpuCells.enabled }}
        - {name: kubernetes-api, mountPath: /var/run/secrets/flyt-kubernetes, readOnly: true}
        {{- end }}
      volumes:
      - name: config
        configMap: {name: {{ include "flyt-adapter.name" . }} }
      - name: tmp
        emptyDir: {}
      {{- if .Values.openstack.caConfigMapName }}
      - name: openstack-ca
        configMap: {name: {{ .Values.openstack.caConfigMapName }}}
      {{- end }}
      {{- if .Values.gpuCells.enabled }}
      - name: kubernetes-api
        projected:
          sources:
          - serviceAccountToken: {path: token, expirationSeconds: 3600}
          - configMap: {name: kube-root-ca.crt, items: [{key: ca.crt, path: ca.crt}]}
      {{- end }}
{{- end }}
