apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "flyt-adapter.name" . }}
  labels:
    {{- include "flyt-adapter.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "flyt-adapter.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes: [Ingress, Egress]
  ingress:
  - from:
    - podSelector: {}
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: openstack
    ports:
    - {protocol: TCP, port: {{ .Values.service.port }}}
  {{- if .Values.clusterManager.enabled }}
  {{- if .Values.clusterManager.nodeCidrs }}
  - from:
    {{- range .Values.clusterManager.nodeCidrs }}
    - ipBlock: {cidr: {{ . | quote }}}
    {{- end }}
    ports:
    - {protocol: TCP, port: {{ .Values.clusterManager.nodePort }}}
  {{- end }}
  - from:
    {{- range .Values.clusterManager.clientCidrs }}
    - ipBlock: {cidr: {{ . | quote }}}
    {{- end }}
    ports:
    - {protocol: TCP, port: {{ .Values.clusterManager.clientPort }}}
  {{- end }}
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: openstack
    ports:
    - {protocol: TCP, port: 443}
    - {protocol: TCP, port: 80}
    - {protocol: TCP, port: 8774}
    - {protocol: TCP, port: 8778}
    - {protocol: TCP, port: 9292}
    - {protocol: TCP, port: 9696}
    {{- if .Values.notifications.enabled }}
    - {protocol: TCP, port: 5672}
    {{- end }}
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
    ports:
    - {protocol: UDP, port: 53}
    - {protocol: TCP, port: 53}
  {{- if .Values.clusterManager.enabled }}
  - to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: {{ include "flyt-adapter.name" . }}-mongodb
    ports:
    - {protocol: TCP, port: 27017}
  {{- end }}
  {{- if .Values.gpuCells.enabled }}
  - to:
    {{- range .Values.gpuCells.apiServerCidrs }}
    - ipBlock: {cidr: {{ . | quote }}}
    {{- end }}
    ports:
    {{- range .Values.gpuCells.apiServerPorts }}
    - {protocol: TCP, port: {{ . }}}
    {{- end }}
{{- end }}
{{- if .Values.gpuCells.enabled }}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ include "flyt-adapter.name" . }}-kube-api
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "flyt-adapter.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  egress:
  - toEntities: [kube-apiserver]
    toPorts:
    - ports:
      {{- range .Values.gpuCells.apiServerPorts }}
      - {port: {{ . | quote }}, protocol: TCP}
      {{- end }}
{{- end }}
{{- if .Values.rackGateway.enabled }}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ include "flyt-adapter.name" . }}-rack-gateway
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "flyt-adapter.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  ingress:
  - fromEntities: [host, remote-node]
    toPorts:
    - ports:
      # Nova compute builds config-drive metadata from host-networked Pods.
      # Limit those node identities to the authenticated Adapter HTTP port.
      - {port: {{ .Values.service.port | quote }}, protocol: TCP}
      - {port: {{ .Values.clusterManager.nodePort | quote }}, protocol: TCP}
      - {port: {{ .Values.clusterManager.clientPort | quote }}, protocol: TCP}
      {{- if .Values.rackGateway.packageProxy.enabled }}
      - {port: {{ .Values.rackGateway.packageProxy.listenPort | quote }}, protocol: TCP}
      {{- end }}
{{- end }}
