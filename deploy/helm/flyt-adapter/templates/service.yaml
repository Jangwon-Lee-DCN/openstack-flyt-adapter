apiVersion: v1
kind: Service
metadata:
  name: {{ include "flyt-adapter.name" . }}
  labels:
    {{- include "flyt-adapter.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: {{ include "flyt-adapter.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
  - {name: http, port: {{ .Values.service.port }}, targetPort: http, protocol: TCP}
