{{- if .Values.rackGateway.enabled }}
{{- $repository := required "rackGateway.image.repository is required" .Values.rackGateway.image.repository }}
{{- $digest := required "rackGateway.image.digest is required" .Values.rackGateway.image.digest }}
{{- $listenIP := required "rackGateway.listenIP is required" .Values.rackGateway.listenIP }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "flyt-adapter.name" . }}-rack-gateway
spec:
  selector:
    matchLabels: {app.kubernetes.io/name: flyt-adapter-rack-gateway, app.kubernetes.io/instance: {{ .Release.Name }}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: flyt-adapter-rack-gateway, app.kubernetes.io/instance: {{ .Release.Name }}}
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      automountServiceAccountToken: false
      nodeSelector:
        {{- toYaml .Values.rackGateway.nodeSelector | nindent 8 }}
      containers:
      - name: node-gateway
        image: {{ printf "%s@%s" $repository $digest | quote }}
        args: ["--mode", "gateway", "--listen-host", {{ $listenIP | quote }}, "--listen-port", {{ .Values.clusterManager.nodePort | quote }}, "--backend-host", "flyt-adapter-manager", "--backend-port", {{ .Values.clusterManager.nodePort | quote }}]
        securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: ["ALL"]}, readOnlyRootFilesystem: true}
      - name: client-gateway
        image: {{ printf "%s@%s" $repository $digest | quote }}
        args: ["--mode", "gateway", "--listen-host", {{ $listenIP | quote }}, "--listen-port", {{ .Values.clusterManager.clientPort | quote }}, "--backend-host", "flyt-adapter-manager", "--backend-port", {{ .Values.clusterManager.clientPort | quote }}]
        securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: ["ALL"]}, readOnlyRootFilesystem: true}
      {{- if .Values.rackGateway.packageProxy.enabled }}
      - name: package-gateway
        image: {{ printf "%s@%s" $repository $digest | quote }}
        args: ["--mode", "gateway", "--listen-host", {{ $listenIP | quote }}, "--listen-port", {{ .Values.rackGateway.packageProxy.listenPort | quote }}, "--backend-host", {{ required "rackGateway.packageProxy.backendHost is required" .Values.rackGateway.packageProxy.backendHost | quote }}, "--backend-port", {{ .Values.rackGateway.packageProxy.backendPort | quote }}]
        securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: ["ALL"]}, readOnlyRootFilesystem: true}
      {{- end }}
{{- end }}
