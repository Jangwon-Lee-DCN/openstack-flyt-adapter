{{- if .Values.clientPackageServer.enabled }}
{{- $repository := required "clientPackageServer.image.repository is required" .Values.clientPackageServer.image.repository }}
{{- $digest := required "clientPackageServer.image.digest is required" .Values.clientPackageServer.image.digest }}
{{- if not (hasPrefix "sha256:" $digest) }}{{ fail "clientPackageServer.image.digest must start with sha256:" }}{{ end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "flyt-adapter.name" . }}-client-package
  labels:
    app.kubernetes.io/name: {{ include "flyt-adapter.name" . }}-client-package
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "flyt-adapter.name" . }}-client-package
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "flyt-adapter.name" . }}-client-package
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
      - name: package
        image: {{ printf "%s@%s" $repository $digest | quote }}
        ports: [{name: http, containerPort: 8080}]
        readinessProbe: {httpGet: {path: /flyt-client.tar.gz, port: http}}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities: {drop: ["ALL"]}
          readOnlyRootFilesystem: true
        volumeMounts:
        - {name: runtime-tmp, mountPath: /tmp}
      volumes:
      - name: runtime-tmp
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "flyt-adapter.name" . }}-client-package
spec:
  selector:
    app.kubernetes.io/name: {{ include "flyt-adapter.name" . }}-client-package
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
  - {name: http, port: {{ .Values.clientPackageServer.servicePort }}, targetPort: http}
{{- if .Values.clientPackageServer.route.enabled }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "flyt-adapter.name" . }}-client-package
spec:
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: {{ .Values.clientPackageServer.route.gatewayName }}
    namespace: {{ .Values.clientPackageServer.route.gatewayNamespace }}
    sectionName: {{ .Values.clientPackageServer.route.sectionName }}
  hostnames: [{{ required "clientPackageServer.route.hostname is required" .Values.clientPackageServer.route.hostname | quote }}]
  rules:
  - matches:
    - path: {type: PathPrefix, value: {{ .Values.clientPackageServer.route.pathPrefix | quote }}}
    filters:
    - type: URLRewrite
      urlRewrite:
        path: {type: ReplacePrefixMatch, replacePrefixMatch: /}
    backendRefs:
    - name: {{ include "flyt-adapter.name" . }}-client-package
      port: {{ .Values.clientPackageServer.servicePort }}
{{- end }}
{{- end }}
