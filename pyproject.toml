[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openstack-flyt-adapter"
version = "0.1.0"
description = "OpenStack lifecycle adapter for FLYT remote GPU sessions"
requires-python = ">=3.11"

[project.optional-dependencies]
notifications = ["oslo.config>=9", "oslo.messaging>=14"]
test = ["PyYAML>=6"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
